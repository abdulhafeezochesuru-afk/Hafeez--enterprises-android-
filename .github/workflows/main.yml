
name: Build Hafeez Enterprises APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HafeezEnterprisesAndroid-Source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p build-src
          unzip -q HafeezEnterprisesAndroid-Source.zip -d build-src

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p build-src/HafeezEnterprisesAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hafeez-Enterprises-APK
          path: build-src/HafeezEnterprisesAndroid/app/build/outputs/apk/debug/app-debug.apk
          
